
services:
  app:
    build: .
    container_name: todolist-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todolist-net

  db:
    image: mysql:8.0
    container_name: todolist-db
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - todolist-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 20s
      timeout: 10s
      retries: 5


volumes:
  mysql_data:

networks:
  todolist-net:
